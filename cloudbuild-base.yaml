# Builds and pushes the Etna base image (Dockerfile.base). Run from the repo root:
#   gcloud builds submit --config cloudbuild-base.yaml --region europe-west3 --project ghostflame
steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-f", "Dockerfile.base", "-t", "europe-west3-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/ghostflame-base:latest", "."]
images:
  - europe-west3-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/ghostflame-base:latest
timeout: 3600s
